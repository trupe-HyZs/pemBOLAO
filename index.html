:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10243b;--text:#f6f8fb;--muted:#9eb0c7;--line:#1d3550;--accent:#39a8ff;--accent2:#7c5cff;--good:#45d483;--danger:#ff5d6c;--shadow:0 18px 50px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#16395d 0,#07111f 42%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:1080px;margin:auto;padding:14px}.top{height:62px;display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:#0b1829cc;backdrop-filter:blur(18px);border-radius:18px;padding:8px 12px;position:sticky;top:10px;z-index:20;box-shadow:var(--shadow)}.brand{font-size:22px;font-weight:900;letter-spacing:-1px;margin-right:8px}.brand b{color:var(--accent)}nav{display:flex;gap:4px;flex:1;overflow:auto}nav button,.menu button{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:10px;white-space:nowrap}nav button:hover,nav button.active,.menu button:hover{background:#ffffff0b;color:#fff}.avatarBtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);overflow:hidden;padding:0}.avatarBtn img{width:100%;height:100%;object-fit:cover}.avatarFallback{display:grid;place-items:center;height:100%;font-weight:900}.menuWrap{position:relative}.menu{position:absolute;right:0;top:48px;width:190px;padding:8px;border:1px solid var(--line);background:#0c1b2eeF;backdrop-filter:blur(20px);border-radius:14px;box-shadow:var(--shadow)}.page{display:none;padding-top:18px}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.two{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#10243bcc,#0a1727d9);border-radius:18px;padding:18px;box-shadow:0 12px 40px #0003}.hero{min-height:310px;display:grid;grid-template-columns:1.4fr .8fr;gap:12px}.heroMain{display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--accent);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.14em}.hero h1{font-size:48px;line-height:.94;margin:10px 0}.hero h1 span{color:var(--accent)}.logo{font-size:30px;font-weight:950;margin-top:22px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#ffffff08;color:#fff}.btn.primary{background:var(--accent);border-color:transparent;color:#03101d;font-weight:800}.btn.danger{background:#ff5d6c1c;color:#ff9ba5;border-color:#ff5d6c44}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.rank{font-weight:900;color:var(--accent);width:35px}.teamRow{display:flex;align-items:center;gap:12px}.shield{width:44px;height:50px;background:linear-gradient(145deg,var(--c1,#247cff),var(--c2,#0b2a63));clip-path:polygon(10% 0,90% 0,100% 75%,50% 100%,0 75%);display:grid;place-items:center;font-weight:950;border:2px solid #fff3}.teamList{display:grid;gap:9px}.teamCard{display:flex;align-items:center;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff05}.stat strong{display:block;font-size:22px}.form{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field textarea,.field select{width:100%;background:#071523;border:1px solid var(--line);color:#fff;border-radius:10px;padding:10px}.field textarea{min-height:100px;resize:vertical}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:var(--accent);color:#03101d;border-color:transparent}.notice{padding:11px;border-radius:10px;background:#ffffff08;border:1px solid var(--line);margin-top:10px}.notice.error{color:#ff9ba5;border-color:#ff5d6c55}.notice.ok{color:#75e8a5;border-color:#45d48355}
/* LEGO */.legoStage{display:grid;grid-template-columns:1fr 180px;gap:14px;align-items:center;min-height:510px}.legoWrap{height:500px;position:relative;display:flex;justify-content:center;align-items:flex-end}.lego{width:250px;height:470px;position:relative;filter:drop-shadow(0 25px 20px #0006)}.head{position:absolute;left:58px;top:22px;width:134px;height:128px;border-radius:18px 18px 24px 24px;background:#f1c27d;border:4px solid #d19b55;z-index:4}.neck{position:absolute;left:100px;top:142px;width:50px;height:22px;background:#e4ad68;z-index:2}.hair{position:absolute;left:-8px;top:-15px;width:150px;height:62px;background:#17191d;border-radius:46% 54% 32% 30%;z-index:7;border:3px solid #0a0a0a}.hair:after{content:"";position:absolute;right:6px;top:7px;width:25px;height:55px;background:#17191d;border-radius:0 18px 25px 18px}.face{position:absolute;inset:0;z-index:8}.eye{position:absolute;top:52px;width:10px;height:12px;border-radius:50%;background:#161616}.eye.l{left:38px}.eye.r{right:38px}.mouth{position:absolute;left:46px;top:78px;width:43px;height:18px;border-bottom:4px solid #5c281d;border-radius:0 0 50% 50%}.torso{position:absolute;left:35px;top:158px;width:180px;height:155px;background:var(--shirt,#d82222);border:5px solid #111;border-radius:16px 16px 24px 24px;z-index:3;overflow:hidden}.torso:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 48%,var(--shirt2,#111) 49% 53%,transparent 54%)}.number{position:absolute;left:0;right:0;top:55px;text-align:center;font-size:38px;font-weight:1000;color:#fff;text-shadow:2px 2px #000;z-index:3}.crest{position:absolute;left:15px;top:12px;width:34px;height:40px;background:var(--crest,#fff);clip-path:polygon(10% 0,90% 0,100% 72%,50% 100%,0 72%);z-index:3;border:2px solid #111}.arm{position:absolute;top:168px;width:54px;height:135px;border:5px solid #111;border-radius:24px;background:var(--shirt,#d82222);z-index:2}.arm.l{left:0;transform:rotate(4deg)}.arm.r{right:0;transform:rotate(-4deg)}.hand{position:absolute;top:276px;width:42px;height:42px;border-radius:50%;background:#f1c27d;border:4px solid #b97c3c;z-index:3}.hand.l{left:0}.hand.r{right:0}.hips{position:absolute;left:54px;top:305px;width:142px;height:65px;background:var(--shorts,#222);border:5px solid #111;border-radius:9px 9px 16px 16px;z-index:3}.leg{position:absolute;top:357px;width:64px;height:96px;background:#e9b773;border:5px solid #111;border-radius:9px;z-index:2}.leg.l{left:60px}.leg.r{right:60px}.boot{position:absolute;top:428px;width:80px;height:38px;background:var(--boot,#fff);border:5px solid #111;border-radius:15px 18px 10px 12px;z-index:5}.boot.l{left:42px}.boot.r{right:42px}.stud{position:absolute;width:10px;height:8px;background:#111;border-radius:50%;bottom:3px}.boot .stud:nth-child(1){left:12px}.boot .stud:nth-child(2){left:32px}.boot .stud:nth-child(3){left:52px}.ball{width:95px;height:95px;border-radius:50%;background:#f4f4f4;border:5px solid #111;position:relative;box-shadow:inset 0 0 0 8px #ddd}.ball:before{content:"⬡";position:absolute;left:22px;top:12px;font-size:45px;color:#111}.ball:after{content:"";position:absolute;inset:15px;border:3px solid #111;border-radius:50%}.editorGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.swatches{display:flex;gap:7px;flex-wrap:wrap}.swatch{width:28px;height:28px;border-radius:8px;border:2px solid #fff4;cursor:pointer}.swatch:hover{border-color:#fff}.profileHero{display:grid;grid-template-columns:160px 1fr 180px;gap:18px;align-items:center}.profilePhoto{width:140px;height:140px;border-radius:22px;overflow:hidden;background:#12243a;border:1px solid var(--line);display:grid;place-items:center;font-size:36px;font-weight:900}.profilePhoto img{width:100%;height:100%;object-fit:cover}.overall{font-size:64px;line-height:1;font-weight:1000;color:var(--accent)}.pos{font-weight:800}.themeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.theme{height:75px;border-radius:13px;border:2px solid transparent;padding:9px;text-align:left;color:#fff;font-weight:800}.theme.active{border-color:#fff}.login{max-width:420px;margin:60px auto}.small{font-size:12px}.footer{padding:30px 0;color:var(--muted);text-align:center}@media(max-width:800px){.grid,.hero,.two,.profileHero,.legoStage{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.top{position:relative;top:0}.hero h1{font-size:38px}.themeGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid,.stats{grid-template-columns:1fr}.app{padding:8px}.top{border-radius:14px}.brand{font-size:19px}.lego{transform:scale(.85);transform-origin:bottom center}}
</style></head><body><div class="app"><header class="top"><div class="brand"><b>BRASILEIRÃO DO</b><br>PEBOLIM • <span>pebolão</span></div><nav id="nav"></nav><div class="menuWrap"><button class="avatarBtn" id="avatarBtn"><span class="avatarFallback">P</span></button><div class="menu hidden" id="menu"></div></div></header><main id="main"></main><div class="footer">pebolão • Brasileirão do Pebolim</div></div><script>
const cfg=window.PEMBOLAO_CONFIG||{};const sb=(cfg.url&&cfg.anonKey&&window.supabase)?supabase.createClient(cfg.url,cfg.anonKey):null;let user=null,profile=null,teams=[],matches=[],profiles=[],page='home',theme='midnight';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const palettes=['#e53935','#111827','#2563eb','#16a34a','#f59e0b','#7c3aed','#ec4899','#06b6d4','#f8fafc','#6b7280'];
const themes={midnight:['#07111f','#39a8ff','#0d1b2e'],emerald:['#061611','#3ee58b','#0d241b'],crimson:['#18080c','#ff5268','#281017'],violet:['#10091d','#a879ff','#1c1030'],amber:['#171004','#ffbf3c','#2a1b06'],forest:['#07140c','#6ee7a2','#10291a'],ocean:['#04131b','#38d5ff','#0b2632'],rose:['#180a12','#ff80b0','#2b1220'],graphite:['#101114','#d5d7dc','#1b1d21'],ice:['#eaf3fa','#1677c8','#fff']};
function applyTheme(n){theme=n;localStorage.pebolao_theme=n;const t=themes[n]||themes.midnight;document.documentElement.style.setProperty('--bg',t[0]);document.documentElement.style.setProperty('--accent',t[1]);document.documentElement.style.setProperty('--panel',t[2]);document.body.style.color=n==='ice'?'#0c1824':'#fff'}
function initials(n){return String(n||'P').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function team(id){return teams.find(t=>t.id===id)}
function char(){let c=profile?.character;try{if(typeof c==='string')c=JSON.parse(c)}catch{};return Object.assign({skinColor:'#f1c27d',hairColor:'#17191d',shirtColor:'#d82222',shirtColor2:'#111111',shortsColor:'#222222',shortsColor2:'#111111',bootsColor:'#ffffff',bootsColor2:'#111111',number:10,shirtStyle:'classic',shortsStyle:'classic',bootsStyle:'cravos',hairStyle:'classic',faceStyle:'smile',position:'Ataque',force:70,dribble:70,shot:70,shieldUrl:''},c||{})}
function overall(c=char()){return Math.round((Number(c.force)||0+Number(c.dribble)||0+Number(c.shot)||0)/3)}
function calcOverall(c=char()){return Math.round(((Number(c.force)||0)+(Number(c.dribble)||0)+(Number(c.shot)||0))/3)}
function lego(c=char()){return `<div class="lego" style="--skin:${esc(c.skinColor)};--hair:${esc(c.hairColor)};--shirt:${esc(c.shirtColor)};--shirt2:${esc(c.shirtColor2)};--shorts:${esc(c.shortsColor)};--boot:${esc(c.bootsColor)};--crest:${esc(c.shieldUrl||'#fff')}"><div class="hair" style="background:${esc(c.hairColor)}"></div><div class="head" style="background:${esc(c.skinColor)}"><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div><div class="neck" style="background:${esc(c.skinColor)}"></div><div class="arm l"></div><div class="arm r"></div><div class="hand l" style="background:${esc(c.skinColor)}"></div><div class="hand r" style="background:${esc(c.skinColor)}"></div><div class="torso"><div class="crest" style="background:${esc(c.shieldUrl||'#fff')}"></div><div class="number">${esc(c.number||10)}</div></div><div class="hips"></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"><i class="stud"></i><i class="stud"></i><i class="stud"></i></div><div class="boot r"><i class="stud"></i><i class="stud"></i><i class="stud"></i></div></div>`}
function nav(){let items=[['home','Início'],['teams','Duplas'],['ranking','Ranking'],['matches','Jogos'],['cups','Copas']];if(profile?.role==='admin'||profile?.role==='vice_admin')items.push(['admin','Organizador']);$('nav').innerHTML=items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function header(){const a=profile?.avatar_url?`<img src="${esc(profile.avatar_url)}">`:`<span class="avatarFallback">${esc(initials(profile?.display_name||user?.email))}</span>`;$('avatarBtn').innerHTML=a;$('menu').innerHTML=user?`<button onclick="go('profile');toggleMenu()">Perfil</button><button onclick="go('pebolim');toggleMenu()">Meu Pebolim</button><button onclick="go('themes');toggleMenu()">Temas</button><button onclick="logout();toggleMenu()">Sair</button>`:`<button onclick="go('login');toggleMenu()">Entrar</button>`;nav()}
function toggleMenu(){$('menu').classList.toggle('hidden')}$('avatarBtn').onclick=toggleMenu;
async function load(){if(!sb)return;const [tr,mr,pr]=await Promise.all([sb.from('teams').select('*').order('name'),sb.from('matches').select('*').order('match_date',{ascending:false}),sb.from('profiles').select('*')]);teams=tr.data||[];matches=mr.data||[];profiles=pr.data||[];if(user){profile=profiles.find(p=>p.id===user.id)||await getProfile()}render()}
async function getProfile(){if(!sb||!user)return null;let r=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(r.data)return r.data;const ins=await sb.from('profiles').insert({id:user.id,email:user.email,display_name:user.user_metadata?.display_name||user.email.split('@')[0]}).select('*').single();return ins.data||null}
function standings(){return teams.map(t=>{let s={...t,j:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};matches.filter(m=>m.team_a===t.id||m.team_b===t.id).forEach(m=>{if(m.score_a==null||m.score_b==null)return;let a=m.team_a===t.id,gf=a?+m.score_a:+m.score_b,ga=a?+m.score_b:+m.score_a;s.j++;s.gf+=gf;s.ga+=ga;if(gf>ga){s.w++;s.pts+=3}else if(gf===ga){s.d++;s.pts++}else s.l++});s.sg=s.gf-s.ga;return s}).sort((a,b)=>b.pts-a.pts||b.sg-a.sg||b.gf-a.gf||a.name.localeCompare(b.name))}
function playerStats(p){let j=0,w=0,g=0,a=0;matches.forEach(m=>{if(m.team_a!==p.team_id&&m.team_b!==p.team_id)return;if(m.score_a==null||m.score_b==null)return;j++;let win=(m.team_a===p.team_id&&m.score_a>m.score_b)||(m.team_b===p.team_id&&m.score_b>m.score_a);if(win)w++;g+=m.team_a===p.team_id?0:0});return{j,w,g,a,t:(p.admin_titles||[]).length}}
function home(){const c=char(),s=standings(),me=profile;return `<section class="page active"><div class="hero"><div class="card heroMain"><div class="kicker">Brasileirão do Pebolim • 2026</div><h1>Seu jogo.<br><span>Seu jogador.</span></h1><p class="muted">O campeonato do pebolim, com duplas, jogos, ranking e seu jogador LEGO.</p><div class="logo">pebolão</div></div><div class="card"><div class="sectionTitle"><b>Seu jogador</b><span class="muted">${esc(me?.display_name||'Visitante')}</span></div>${user?`<div class="legoStage"><div class="legoWrap">${lego(c)}</div><div><div class="stat"><strong>${calcOverall(c)}</strong><span class="muted">Overall</span></div><div class="stat" style="margin-top:8px"><strong>${esc(c.position)}</strong><span class="muted">Posição</span></div></div></div>`:`<div class="notice">Entre na conta para ver seu jogador LEGO.</div>`}</div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">Duplas</div><div class="stat"><strong>${teams.length}</strong></div></div><div class="card"><div class="muted">Jogos</div><div class="stat"><strong>${matches.length}</strong></div></div><div class="card"><div class="muted">Líder</div><div class="stat"><strong>${esc(s[0]?.name||'—')}</strong></div></div></div><div class="two" style="margin-top:12px"><div class="card"><div class="sectionTitle"><h2>Ranking das duplas</h2><button class="btn" onclick="go('ranking')">Ver tudo</button></div>${rankTable(s.slice(0,6))}</div><div class="card"><div class="sectionTitle"><h2>Duplas</h2><button class="btn" onclick="go('teams')">Abrir</button></div><div class="teamList">${teams.slice(0,6).map(teamCard).join('')}</div></div></div></section>`}
function rankTable(s){return `<table class="table"><thead><tr><th>#</th><th>Dupla</th><th>J</th><th>SG</th><th>PTS</th></tr></thead><tbody>${s.map((x,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(x.name)}</b><br><span class="muted small">${esc(x.players||'')}</span></td><td>${x.j}</td><td>${x.sg}</td><td><b>${x.pts}</b></td></tr>`).join('')}</tbody></table>`}
function teamCard(t){return `<div class="teamCard"><div class="shield" style="--c1:${esc(t.primary_color||'#2563eb')};--c2:${esc(t.secondary_color||'#0b2a63')}">${esc((t.name||'D').slice(0,2).toUpperCase())}</div><div><b>${esc(t.name)}</b><div class="muted small">${esc(t.players||'')}</div></div></div>`}
function teamsPage(){return `<section class="page active"><div class="card"><div class="sectionTitle"><div><h2>Duplas</h2><div class="muted">Todas as duplas cadastradas no Brasileirão do Pebolim.</div></div><button class="btn" onclick="load()">Atualizar</button></div><div class="teamList">${teams.length?teams.map(teamCard).join(''):'<div class="notice">Nenhuma dupla encontrada no Supabase.</div>'}</div></div></section>`}
function rankingPage(){const s=standings();const ps=profiles.filter(p=>p.team_id).map(p=>({...p,st:playerStats(p)})).sort((a,b)=>calcOverall(b.character)-calcOverall(a.character));return `<section class="page active"><div class="card"><div class="tabs"><button class="btn active" onclick="showRank('teams',this)">Duplas</button><button class="btn" onclick="showRank('players',this)">Jogadores</button></div><div id="rankBox">${rankTable(s)}</div></div></section>`}
function showRank(k,el){document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(k==='teams')$('rankBox').innerHTML=rankTable(standings());else{const ps=profiles.filter(p=>p.team_id).sort((a,b)=>calcOverall(b.character)-calcOverall(a.character));$('rankBox').innerHTML=`<table class="table"><thead><tr><th>#</th><th>Jogador</th><th>Dupla</th><th>OVR</th><th>Pos.</th></tr></thead><tbody>${ps.map((p,i)=>{const c=charOf(p);return `<tr><td class="rank">${i+1}</td><td><b>${esc(p.display_name)}</b></td><td>${esc(team(p.team_id)?.name||'—')}</td><td><b>${calcOverall(c)}</b></td><td>${esc(c.position)}</td></tr>`}).join('')}</tbody></table>`}}
function charOf(p){let c=p?.character;try{if(typeof c==='string')c=JSON.parse(c)}catch{};return Object.assign({force:70,dribble:70,shot:70,position:'Ataque'},c||{})}
function profilePage(){if(!user)return loginPage();const c=char();const stats=playerStats(profile);return `<section class="page active"><div class="card"><div class="profileHero"><div><div class="profilePhoto">${profile?.avatar_url?`<img src="${esc(profile.avatar_url)}">`:esc(initials(profile?.display_name))}</div><input id="avatarFile" type="file" accept="image/*" style="margin-top:10px;width:100%"><button class="btn primary" style="margin-top:8px;width:100%" onclick="uploadAvatar()">Salvar foto</button></div><div><h1 style="margin:0">${esc(profile?.display_name||'Jogador')}#${esc(c.number||10)}</h1><div class="muted">${esc(team(profile?.team_id)?.name||'Sem dupla')}</div><p>${esc(profile?.bio||'Sem biografia.')}</p><div class="stats"><div class="stat"><strong>${stats.j}</strong>Jogos</div><div class="stat"><strong>${stats.g}</strong>Gols</div><div class="stat"><strong>${stats.a}</strong>Assistências</div><div class="stat"><strong>${stats.t}</strong>Títulos</div></div></div><div><div class="overall">${calcOverall(c)}</div><div class="muted">OVERALL</div><div class="pos">${esc(c.position)}</div></div></div></div><div class="card" style="margin-top:12px"><div class="form"><div class="field"><label>Nome</label><input id="pName" value="${esc(profile?.display_name||'')}"></div><div class="field"><label>Biografia</label><textarea id="pBio">${esc(profile?.bio||'')}</textarea></div><button class="btn primary" onclick="saveProfile()">Salvar perfil</button></div></div></section>`}
function pebolimPage(){if(!user)return loginPage();let c=char();return `<section class="page active"><div class="two"><div class="card"><div class="sectionTitle"><div><h2>Meu Pebolim</h2><div class="muted">Monte seu jogador LEGO.</div></div><div class="overall" style="font-size:42px">${calcOverall(c)}</div></div><div class="legoStage"><div class="legoWrap" id="legoLive">${lego(c)}</div><div><div class="card"><b>Overall ${calcOverall(c)}</b><div class="muted small">Força + Drible + Chute</div></div><div class="card" style="margin-top:8px"><b>${esc(c.position)}</b><div class="muted small">Posição</div></div></div></div></div><div class="card"><div class="tabs"><button class="btn active" onclick="editTab('camisa',this)">Editar camisa</button><button class="btn" onclick="editTab('aparencia',this)">Rosto e cabelo</button><button class="btn" onclick="editTab('atributos',this)">Overall</button></div><div id="editBox"></div></div></div></section>`}
function editTab(k,el){document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');const c=char();if(k==='camisa')$('editBox').innerHTML=`<div class="form"><div class="field"><label>Número da camisa</label><input id="num" type="number" min="1" max="99" value="${esc(c.number)}" oninput="liveNum(this.value)"></div><div class="field"><label>Cor primária</label><input id="shirt" type="color" value="${c.shirtColor}" oninput="liveColor('shirtColor',this.value)"></div><div class="field"><label>Cor secundária</label><input id="shirt2" type="color" value="${c.shirtColor2}" oninput="liveColor('shirtColor2',this.value)"></div><div class="field"><label>Escudo da dupla</label><select id="shield"><option value="">Usar escudo da dupla</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="saveCharacter()">Salvar camisa</button></div>`;else if(k==='aparencia')$('editBox').innerHTML=`<div class="form"><div class="field"><label>Cor da pele</label><input type="color" value="${c.skinColor}" oninput="liveColor('skinColor',this.value)"></div><div class="field"><label>Cor do cabelo</label><input type="color" value="${c.hairColor}" oninput="liveColor('hairColor',this.value)"></div><div class="field"><label>Cabelo</label><select id="hairStyle">${['Clássico','Dividido','Cacheado','Black power','Degradê','Undercut','Coque','Moicano','Para trás','Longo','César','Topete','Raspado','Afro curto','Ondulado','Tranças'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Rosto</label><select id="faceStyle">${['Sorriso','Sério','Piscadinha','Barba','Clássico','Bigode','Óculos','Sorriso aberto','Cara de jogo','Confiante','Surpreso','Determinado'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn primary" onclick="saveCharacter()">Salvar aparência</button></div>`;else $('editBox').innerHTML=`<div class="form"><div class="field"><label>Força: <b id="fv">${c.force}</b></label><input id="force" type="range" min="1" max="99" value="${c.force}" oninput="attrLive()"></div><div class="field"><label>Drible: <b id="dv">${c.dribble}</b></label><input id="dribble" type="range" min="1" max="99" value="${c.dribble}" oninput="attrLive()"></div><div class="field"><label>Chute: <b id="sv">${c.shot}</b></label><input id="shot" type="range" min="1" max="99" value="${c.shot}" oninput="attrLive()"></div><div class="field"><label>Posição</label><select id="position"><option ${c.position==='Ataque'?'selected':''}>Ataque</option><option ${c.position==='Defesa'?'selected':''}>Defesa</option></select></div><div class="notice">Overall: <b id="ov">${calcOverall(c)}</b></div><button class="btn primary" onclick="saveCharacter()">Salvar atributos</button></div>`}
function liveNum(v){let c=char();c.number=Math.max(1,Math.min(99,+v||1));document.getElementById('legoLive').innerHTML=lego(c)}function liveColor(k,v){let c=char();c[k]=v;document.getElementById('legoLive').innerHTML=lego(c)}function attrLive(){let c=char();c.force=+$('force').value;c.dribble=+$('dribble').value;c.shot=+$('shot').value;$('fv').textContent=c.force;$('dv').textContent=c.dribble;$('sv').textContent=c.shot;$('ov').textContent=calcOverall(c)}
async function saveCharacter(){let c=char();if($('num'))c.number=+$('num').value;if($('shield')?.value){const t=team($('shield').value);if(t)c.shieldUrl=t.primary_color||'#fff'}if($('hairStyle'))c.hairStyle=$('hairStyle').value;if($('faceStyle'))c.faceStyle=$('faceStyle').value;if($('force')){c.force=+$('force').value;c.dribble=+$('dribble').value;c.shot=+$('shot').value;c.position=$('position').value}const r=await sb.from('profiles').update({character:c}).eq('id',user.id);if(r.error)return alert(r.error.message);profile=await getProfile();render()}
async function saveProfile(){const r=await sb.from('profiles').update({display_name:$('pName').value.trim(),bio:$('pBio').value.trim()}).eq('id',user.id);if(r.error)alert(r.error.message);else{profile=await getProfile();render()}}
async function resizeFile(file,max=900){return new Promise((res,rej)=>{const im=new Image;im.onload=()=>{const scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.88)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
async function uploadAvatar(){const f=$('avatarFile')?.files?.[0];if(!f)return alert('Escolha uma foto.');const blob=await resizeFile(f,900);const path=`${user.id}/avatar.jpg`;const up=await sb.storage.from('profile-media').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(up.error)return alert(up.error.message);const url=sb.storage.from('profile-media').getPublicUrl(path).data.publicUrl+'?v='+Date.now();const r=await sb.from('profiles').update({avatar_url:url}).eq('id',user.id);if(r.error)return alert(r.error.message);profile=await getProfile();render()}
function themesPage(){return `<section class="page active"><div class="card"><h2>Temas</h2><div class="themeGrid">${Object.entries(themes).map(([k,t])=>`<button class="theme ${theme===k?'active':''}" style="background:linear-gradient(135deg,${t[0]},${t[2]})" onclick="applyTheme('${k}');render()">${k}</button>`).join('')}</div></div></section>`}
function matchesPage(){return `<section class="page active"><div class="card"><h2>Jogos</h2>${matches.length?matches.map(m=>`<div class="notice"><b>${esc(team(m.team_a)?.name||'—')}</b> ${m.score_a??'–'} × ${m.score_b??'–'} <b>${esc(team(m.team_b)?.name||'—')}</b><span class="muted"> • ${esc(m.match_date||'')}</span></div>`).join(''):'<div class="notice">Nenhum jogo registrado.</div>'}</div></section>`}
function cupsPage(){return `<section class="page active"><div class="card"><h2>Copas</h2><div class="notice">Área de copas preservada. Os dados existentes continuam no Supabase.</div></div></section>`}
function adminPage(){if(!['admin','vice_admin'].includes(profile?.role))return `<section class="page active"><div class="card"><h2>Organizador</h2><div class="notice error">Acesso restrito.</div></div></section>`;return `<section class="page active"><div class="grid"><div class="card"><h3>Usuários</h3><strong style="font-size:30px">${profiles.length}</strong></div><div class="card"><h3>Duplas</h3><strong style="font-size:30px">${teams.length}</strong></div><div class="card"><h3>Jogos</h3><strong style="font-size:30px">${matches.length}</strong></div></div><div class="card" style="margin-top:12px"><h2>Duplas cadastradas</h2>${teams.map(teamCard).join('')}</div></section>`}
function loginPage(){return `<section class="page active"><div class="card login"><h2>Entrar no pebolão</h2><div class="form"><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="pass" type="password"></div><button class="btn primary" onclick="login()">Entrar</button><div id="loginMsg"></div></div></div></section>`}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(r.error)$('loginMsg').innerHTML=`<div class="notice error">${esc(r.error.message)}</div>`}
async function logout(){await sb?.auth.signOut();user=null;profile=null;page='home';render()}
function go(p){page=p;render();window.scrollTo(0,0)}
function render(){if(!theme)theme='midnight';header();const content={home,teams:teamsPage,ranking:rankingPage,matches:matchesPage,cups:cupsPage,profile:profilePage,pebolim:pebolimPage,themes:themesPage,admin:adminPage,login:loginPage}[page]||home;$('main').innerHTML=content()}
(async()=>{theme=localStorage.pebolao_theme||'midnight';applyTheme(theme);if(sb){const r=await sb.auth.getSession();user=r.data.session?.user||null;if(user)profile=await getProfile();await load()}else render();sb?.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;profile=user?await getProfile():null;await load()})})();
</script></body></html>
