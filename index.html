</style></head><body><div class="app"><header class="top"><div class="brand"><b>BRASILEIRÃO DO</b><br>PEBOLIM • <span>pebolão</span></div><nav id="nav"></nav><div class="menuWrap"><button class="avatarBtn" id="avatarBtn"><span class="avatarFallback">P</span></button><div class="menu hidden" id="menu"></div></div></header><main id="main"></main><div class="footer">pebolão • Brasileirão do Pebolim</div></div><script>
const cfg=window.PEMBOLAO_CONFIG||{};const sb=(cfg.url&&cfg.anonKey&&window.supabase)?supabase.createClient(cfg.url,cfg.anonKey):null;let user=null,profile=null,teams=[],matches=[],profiles=[],page='home',theme='midnight';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const palettes=['#e53935','#111827','#2563eb','#16a34a','#f59e0b','#7c3aed','#ec4899','#06b6d4','#f8fafc','#6b7280'];
const themes={midnight:{bg:'#07111f',accent:'#39a8ff',panel:'#0d1b2e',font:'Inter',display:'Barlow Condensed'},emerald:{bg:'#061611',accent:'#3ee58b',panel:'#0d241b',font:'Inter',display:'Barlow Condensed'},crimson:{bg:'#18080c',accent:'#ff5268',panel:'#281017',font:'Inter',display:'Barlow Condensed'},violet:{bg:'#10091d',accent:'#a879ff',panel:'#1c1030',font:'Inter',display:'Barlow Condensed'},amber:{bg:'#171004',accent:'#ffbf3c',panel:'#2a1b06',font:'Inter',display:'Barlow Condensed'},forest:{bg:'#07140c',accent:'#6ee7a2',panel:'#10291a',font:'Inter',display:'Barlow Condensed'},ocean:{bg:'#04131b',accent:'#38d5ff',panel:'#0b2632',font:'Inter',display:'Barlow Condensed'},rose:{bg:'#180a12',accent:'#ff80b0',panel:'#2b1220',font:'Inter',display:'Barlow Condensed'},graphite:{bg:'#101114',accent:'#d5d7dc',panel:'#1b1d21',font:'Inter',display:'Barlow Condensed'},ice:{bg:'#eaf3fa',accent:'#1677c8',panel:'#fff',font:'Inter',display:'Barlow Condensed'},sunset:{bg:'#1d0d07',accent:'#ff7b3d',panel:'#32160d',font:'Inter',display:'Barlow Condensed'},neon:{bg:'#090b16',accent:'#d7ff3f',panel:'#171b2c',font:'Inter',display:'Barlow Condensed'}};function lego(c=char()){const hm={'Clássico':'classic','Dividido':'dividido','Cacheado':'cacheado','Black power':'black','Degradê':'degrade','Undercut':'undercut','Coque':'coque','Moicano':'moicano','Para trás':'para','Longo':'longo','César':'cesar','Topete':'topete','Raspado':'raspado','Afro curto':'afro','Ondulado':'ondulado','Tranças':'trancas'};const fm={'Sorriso':'sorriso','Sério':'serio','Piscadinha':'piscadinha','Barba':'barba','Clássico':'classico','Bigode':'bigode','Óculos':'oculos','Sorriso aberto':'aberto','Cara de jogo':'jogo','Confiante':'confiante','Surpreso':'surpreso','Determinado':'determinado'};const t=team(profile?.team_id);const shield=t?.shield_url||t?.logo_url||c.shieldUrl||'';const crest=/^(https?:|data:|blob:)/.test(shield)?`<img src="${esc(shield)}">`:'';return `<div class="lego" style="--skin:${esc(c.skinColor)};--shirt:${esc(c.shirtColor)};--shirt2:${esc(c.shirtColor2)};--shorts:${esc(c.shortsColor)};--shorts2:${esc(c.shortsColor2)};--boot:${esc(c.bootsColor)};--boot2:${esc(c.bootsColor2)}"><div class="hair style-${esc(hm[c.hairStyle]||'classic')}" style="background:${esc(c.hairColor)};color:${esc(c.hairColor)}"></div><div class="head" style="background:${esc(c.skinColor)}"><div class="face face-${esc(fm[c.faceStyle]||'sorriso')}"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div><div class="neck" style="background:${esc(c.skinColor)}"></div><div class="arm l"></div><div class="arm r"></div><div class="hand l" style="background:${esc(c.skinColor)}"></div><div class="hand r" style="background:${esc(c.skinColor)}"></div><div class="torso"><div class="crest">${crest}</div><div class="number">${esc(c.number||10)}</div></div><div class="hips"></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"><i class="stud"></i><i class="stud"></i><i class="stud"></i></div><div class="boot r"><i class="stud"></i><i class="stud"></i><i class="stud"></i></div></div>`}
function teamsPage(){return `<section class="page active"><div class="card"><h2>Ranking de Duplas</h2><div class="muted" style="margin-bottom:12px">Classificação das duplas pelo desempenho nos jogos.</div>${rankTable(standings())}</div></section>`}
function myTeamPage(){if(!user)return loginPage();const t=team(profile?.team_id);if(!t)return `<section class="page active"><div class="card"><h2>Meu Time</h2><div class="notice">Você ainda não está vinculado a um time.</div></div></section>`;return `<section class="page active"><div class="two"><div class="card"><div class="sectionTitle"><div><h2>Meu Time</h2><div class="muted">${esc(t.name)}</div></div><div class="shield" style="--c1:${esc(t.primary_color||'#2563eb')};--c2:${esc(t.secondary_color||'#0b2a63')}">${esc((t.name||'TM').slice(0,2).toUpperCase())}</div></div><div class="legoStage"><div class="legoWrap">${lego(char())}</div><div><div class="stat"><strong>${calcOverall(char())}</strong> Overall</div><div class="stat" style="margin-top:8px"><strong>${esc(char().position)}</strong> Posição</div></div></div></div><div class="card"><div class="tabs"><button class="btn active" onclick="editTab('camisa',this)">Camisa</button><button class="btn" onclick="editTab('aparencia',this)">LEGO: rosto e cabelo</button><button class="btn" onclick="editTab('posicao',this)">Posição</button><button class="btn" onclick="teamShieldEditor(this)">Escudo do time</button></div><div id="editBox"></div></div></div></section>`}
function teamShieldEditor(el){document.querySelectorAll('.tabs .btn').forEach(x=>x.classList.remove('active'));el.classList.add('active');const t=team(profile?.team_id);$('editBox').innerHTML=`<div class="form"><div class="notice">O dono do time pode personalizar o escudo. O Organizador não é necessário.</div><div class="field"><label>Imagem do escudo</label><input id="teamShield" type="file" accept="image/*"></div><div class="field"><label>Cor primária</label><input id="tc1" type="color" value="${t.primary_color||'#2563eb'}"></div><div class="field"><label>Cor secundária</label><input id="tc2" type="color" value="${t.secondary_color||'#0b2a63'}"></div><button class="btn primary" onclick="saveMyTeam()">Salvar escudo</button><div id="teamMsg"></div></div>`}
async function saveMyTeam(){const t=team(profile?.team_id);if(!t)return;let patch={primary_color:$('tc1').value,secondary_color:$('tc2').value};const f=$('teamShield')?.files?.[0];if(f){const blob=await resizeFile(f,800);const path=`teams/${t.id}/shield.jpg`;const up=await sb.storage.from('team-media').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(up.error){$('teamMsg').innerHTML=`<div class="notice error">${esc(up.error.message)}</div>`;return}patch.shield_url=sb.storage.from('team-media').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}const r=await sb.from('teams').update(patch).eq('id',t.id);if(r.error){$('teamMsg').innerHTML=`<div class="notice error">${esc(r.error.message)}</div>`;return}await load()}
